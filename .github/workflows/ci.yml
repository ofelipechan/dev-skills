name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:registry
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # Runs only when a GitHub Release is published (tag v1.2.3) and only after the test matrix passed.
  # Pushing a tag alone does nothing; create the release on GitHub (or `gh release create v1.2.3`).
  publish:
    needs: test
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: Tag must match packages/cli version
        working-directory: packages/cli
        run: |
          TAG="${RELEASE_TAG#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Publish
        working-directory: packages/cli
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
